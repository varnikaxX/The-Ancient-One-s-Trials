# Nginx edge for The Ancient One's Trials.
# Include from nginx.conf's http{} block (or drop into conf.d/). Replace the placeholders marked CHANGE-ME.

# Rate limiting: per client IP, and per bearer token (falls back to IP when no token is sent).
map $http_authorization $token_key { default $http_authorization; "" $binary_remote_addr; }
limit_req_zone $binary_remote_addr zone=per_ip:10m    rate=20r/s;
limit_req_zone $token_key          zone=per_token:10m rate=10r/s;
limit_req_status 429;

upstream trials_api { server 127.0.0.1:8000; keepalive 32; }

server {
    listen 80;
    server_name trials.example.edu;                       # CHANGE-ME
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trials.example.edu;                       # CHANGE-ME

    # TLS termination placeholders
    ssl_certificate     /etc/letsencrypt/live/trials.example.edu/fullchain.pem;   # CHANGE-ME
    ssl_certificate_key /etc/letsencrypt/live/trials.example.edu/privkey.pem;     # CHANGE-ME
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Static React build
    root /var/www/trials/frontend/dist;                   # CHANGE-ME: path to frontend/dist
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }

    # SSE: no buffering, long read timeout (must come BEFORE the generic /api/ block)
    location = /api/events {
        proxy_pass http://trials_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    # REST API
    location /api/ {
        limit_req zone=per_ip    burst=40 nodelay;
        limit_req zone=per_token burst=20 nodelay;
        proxy_pass http://trials_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
}
